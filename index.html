<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Helper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>AI Study Helper</h1>
        <p>Paste your notes and generate flashcards to study from.</p>
    </header>

    <main>
        <section id="input-section">
            <label for="notes">Your notes:</label>
            <textarea id="notes" rows="10" placeholder="Paste your study notes here..."></textarea>

            <label for="count">Number of flashcards:</label>
            <input type="number" id="count" value="5" min="1" max="20">

            <button id="generate-btn">Generate Flashcards</button>
        </section>

        <section id="output-section">
            <p id="status">Your flashcards will appear here.</p>
        </section>
    </main>

    <footer>
        <p>Built by Panchal (125538) — S2-PFD200 Professional Development</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
